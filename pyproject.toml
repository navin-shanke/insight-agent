[project]
name = "insight-agent"
version = "0.1.0"
description = "Insight Agent -- a personal research agent that discovers, verifies, remembers, and reports useful information."
requires-python = ">=3.12"
authors = [{ name = "Insight Agent" }]
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.5",
    "alembic>=1.20.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "langgraph>=1.2.16",
    "langchain-core>=1.6.12",
    "beautifulsoup4>=4.12.0",
    # Phase 5 additions
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "aiosqlite>=0.20.0",
    "sse-starlette>=1.6.5",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ddgs>=9.0.0",
    "langchain-ollama>=1.1.0",
]

[project.scripts]
insight-agent = "app.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
