[project]
name = "insight-agent"
version = "0.1.0"
description = "Insight Agent — a personal research agent that discovers, verifies, remembers, and reports useful information."
requires-python = ">=3.12"
authors = [{ name = "Insight Agent" }]
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.5",
    "alembic>=1.20.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "langgraph>=1.2.16",
    "langchain-core>=1.6.12",
]

[project.scripts]
insight-agent = "app.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
